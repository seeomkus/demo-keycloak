<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSO Demo — Step by Step</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #4493f8;
    --accent-soft: #0c2d48;
    --green: #3fb950;
    --amber: #d29922;
    --red: #f85149;
    --code-bg: #010409;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* Top progress bar */
  .topbar {
    padding: 0.9rem 1.5rem 0.6rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.6rem;
  }
  .title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .step-counter {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .progress-track {
    height: 6px;
    background: var(--panel);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #79c0ff);
    border-radius: 999px;
    transition: width 0.45s cubic-bezier(.4,0,.2,1);
  }
  .dots {
    display: flex;
    gap: 6px;
    margin-top: 0.7rem;
    flex-wrap: wrap;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: background 0.3s, transform 0.3s;
    border: none;
    padding: 0;
  }
  .dot:hover { transform: scale(1.3); }
  .dot.active { background: var(--accent); transform: scale(1.35); }
  .dot.done { background: var(--green); }

  /* Slide area */
  .stage {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .slide {
    position: absolute;
    inset: 0;
    padding: 1.8rem 2.5rem 1.5rem;
    overflow-y: auto;
    opacity: 0;
    transform: translateX(40px);
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(.4,0,.2,1);
  }
  .slide.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }
  .slide.exit-left {
    opacity: 0;
    transform: translateX(-40px);
  }
  .slide-inner { max-width: 860px; margin: 0 auto; }

  .kicker {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
    margin-bottom: 0.9rem;
    animation: pop 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  h1 {
    font-size: 1.7rem;
    margin: 0 0 0.9rem;
    animation: rise 0.5s ease 0.05s both;
  }
  h2 { font-size: 1.15rem; color: var(--accent); margin: 1.6rem 0 0.6rem; animation: rise 0.5s ease 0.1s both; }
  p, li { color: var(--text); line-height: 1.65; font-size: 0.98rem; }
  .lead { color: var(--text-muted); font-size: 1.02rem; animation: rise 0.5s ease 0.1s both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 0.8rem;
    margin: 1rem 0;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    animation: rise 0.5s ease both;
  }
  .card h3 { margin: 0 0 0.3rem; font-size: 0.95rem; color: var(--text); }
  .card .url { font-family: ui-monospace, monospace; font-size: 0.85rem; color: var(--accent); }
  .card .cred { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.2rem; }

  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.9rem 1rem;
    overflow-x: auto;
    font-size: 0.84rem;
    animation: rise 0.5s ease 0.15s both;
  }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .inline-code {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 0.1em 0.4em;
    border-radius: 4px;
    font-size: 0.88em;
  }

  ol.steps, ul.bullets {
    padding-left: 1.3rem;
    animation: rise 0.5s ease 0.15s both;
  }
  ol.steps li, ul.bullets li { margin-bottom: 0.55rem; }

  .callout {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    padding: 0.7rem 1rem;
    border-radius: 0 8px 8px 0;
    margin: 1rem 0;
    font-size: 0.92rem;
    animation: rise 0.5s ease 0.2s both;
  }
  .callout.warn { border-color: var(--amber); background: #3a2c0a; }
  .callout.danger { border-color: var(--red); background: #3d1414; }
  .callout .say { font-style: italic; color: var(--text-muted); }

  .flow {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 1rem 0;
    animation: rise 0.5s ease 0.15s both;
  }
  .flow .node {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 0.85rem;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .flow .arrow { color: var(--text-muted); font-size: 1.1rem; }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  @media (max-width: 620px) { .two-col { grid-template-columns: 1fr; } }

  table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.8rem 0;
    font-size: 0.88rem;
    animation: rise 0.5s ease 0.15s both;
  }
  th, td { border: 1px solid var(--border); padding: 0.45rem 0.7rem; text-align: left; }
  th { background: var(--panel); }

  .badge-ok { color: var(--green); font-weight: 600; }
  .badge-watch { color: var(--amber); font-weight: 600; }

  /* Bottom nav */
  .navbar {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.55rem 1.1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, border-color 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .btn:hover:not(:disabled) { background: #21262d; border-color: var(--accent); }
  .btn:active:not(:disabled) { transform: scale(0.96); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #041022; font-weight: 600; }
  .btn.primary:hover { background: #63a9ff; }
  .hint { font-size: 0.78rem; color: var(--text-muted); text-align: center; flex: 1; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="topbar-row">
      <span class="title">🔐 SSO Demo Walkthrough</span>
      <span class="step-counter"><span id="curNum">1</span> / <span id="totalNum">10</span></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="navbar">
    <button class="btn" id="prevBtn">← Prev</button>
    <span class="hint">Use ← → arrow keys, or click the dots above, to navigate</span>
    <button class="btn primary" id="nextBtn">Next →</button>
  </div>

</div>

<script>
const slides = [

// 0 ---------------------------------------------------------------
`<span class="kicker">Presenter's Guide</span>
<h1>SSO Demo — Keycloak + Next.js + FastAPI + PostgreSQL</h1>
<p class="lead">A click-by-click walkthrough for running this demo live — from a cold start to a full teardown. Use the Next button below to move through it step by step.</p>
<div class="flow">
  <div class="node">Browser</div><span class="arrow">→</span>
  <div class="node">Next.js Portal :3088</div><span class="arrow">→</span>
  <div class="node">Keycloak :8088</div><span class="arrow">→</span>
  <div class="node">FastAPI :8089</div><span class="arrow">→</span>
  <div class="node">PostgreSQL :5432</div>
</div>
<div class="callout">One Keycloak, one realm, two independent client applications, one shared user. Keycloak owns authentication; Next.js owns the UI; FastAPI owns business logic and talks to its own database — separate from Keycloak's own database.</div>`,

// 1 ---------------------------------------------------------------
`<span class="kicker">Step 0</span>
<h1>Before You Start</h1>
<p class="lead">Have these URLs and credentials ready before the audience arrives.</p>
<div class="cards">
  <div class="card"><h3>Keycloak Admin Console</h3><div class="url">localhost:8088/admin</div><div class="cred">admin / admin123</div></div>
  <div class="card"><h3>Next.js Portal</h3><div class="url">localhost:3088</div></div>
  <div class="card"><h3>Next.js Admin</h3><div class="url">localhost:3089</div></div>
  <div class="card"><h3>FastAPI</h3><div class="url">localhost:8089</div></div>
  <div class="card"><h3>Demo user (for login)</h3><div class="url">demo.user</div><div class="cred">DemoUser@123</div></div>
</div>
<div class="callout warn">Open <strong>two browser tabs in the same browser window</strong> (not two different browsers, and not two Incognito windows) — one for the Portal, one for the Admin app. SSO relies on shared cookies.</div>`,

// 2 ---------------------------------------------------------------
`<span class="kicker">Step 1</span>
<h1>Start Every Service</h1>
<p class="lead">Run each of these in its own terminal, in this order.</p>
<pre><code># 1. PostgreSQL — usually already running as a Windows service
Get-Service postgresql-x64-17</code></pre>
<pre><code># 2. Keycloak
cd C:\\Keycloak\\keycloak-26.7.3\\bin
KC_DB_PASSWORD=keycloak_demo_pass KC_BOOTSTRAP_ADMIN_USERNAME=admin KC_BOOTSTRAP_ADMIN_PASSWORD=admin123 \\
  ./kc.bat start-dev --http-port=8088</code></pre>
<pre><code># 3. FastAPI
cd fastapi-app
venv/Scripts/python.exe -m uvicorn main:app --host 0.0.0.0 --port 8089</code></pre>
<pre><code># 4. Next.js Portal            # 5. Next.js Admin
cd nextjs-portal                cd nextjs-admin
npm run dev                     npm run dev</code></pre>
<div class="callout">Verify: all four HTTP endpoints should respond. Keycloak's root path returns a redirect — that's normal and means it's alive.</div>`,

// 3 ---------------------------------------------------------------
`<span class="kicker">Step 2</span>
<h1>Walk the Architecture</h1>
<p class="lead">Before clicking anything, show the shape of the system to the audience.</p>
<div class="two-col">
  <div class="card">
    <h3>🧑‍💻 Identity Provider</h3>
    <p style="font-size:0.88rem">Keycloak :8088 — realm <span class="inline-code">demo-sso</span>. Owns authentication, sessions, and the user directory.</p>
  </div>
  <div class="card">
    <h3>🖥️ Two Independent Apps</h3>
    <p style="font-size:0.88rem">Next.js Portal :3088 and Next.js Admin :3089 — separate clients, same realm, same user.</p>
  </div>
  <div class="card">
    <h3>⚙️ Backend</h3>
    <p style="font-size:0.88rem">FastAPI :8089 — validates Bearer tokens, owns business logic and its own database.</p>
  </div>
  <div class="card">
    <h3>🗄️ Databases</h3>
    <p style="font-size:0.88rem"><span class="inline-code">keycloak_db</span> and <span class="inline-code">demo_app_db</span> — logically separate, both PostgreSQL.</p>
  </div>
</div>
<div class="callout"><span class="say">Say this out loud:</span> "One Keycloak, one realm, two separate client applications, one shared user. Keycloak owns authentication; Next.js owns the UI; FastAPI owns business logic and talks to its own database — completely separate from Keycloak's own database."</div>`,

// 4 ---------------------------------------------------------------
`<span class="kicker">Step 3 · Demo Action</span>
<h1>Login on the Portal</h1>
<p class="lead">Tab 1 → <span class="inline-code">http://localhost:3088</span></p>
<ol class="steps">
  <li>Click <strong>Login</strong>.</li>
  <li>You land on Keycloak's own login page (<span class="inline-code">localhost:8088</span>) — point out: this is <em>not</em> the Portal's page, this is Keycloak's — the Portal never sees the password.</li>
  <li>Enter <span class="inline-code">demo.user</span> / <span class="inline-code">DemoUser@123</span>.</li>
  <li>You're redirected back to the Portal, landing on <span class="inline-code">/profile</span>.</li>
</ol>
<h2>What to point out on /profile</h2>
<ul class="bullets">
  <li>Identity claims shown: Username, Email, Name, Subject, Issuer.</li>
  <li><strong>No access token, refresh token, or client secret is ever shown</strong> — say this explicitly.</li>
  <li>Scroll to <strong>"FastAPI Backend Call"</strong> — proves the Portal's server called FastAPI with a Bearer token and got <span class="badge-ok">HTTP 200</span> back.</li>
</ul>`,

// 5 ---------------------------------------------------------------
`<span class="kicker">Step 4 · The Main Event</span>
<h1>Single Sign-On</h1>
<p class="lead"><strong>Do not log out of the Portal.</strong> Tab 2 → <span class="inline-code">http://localhost:3089</span></p>
<ol class="steps">
  <li>Click <strong>Login</strong>.</li>
  <li><strong>Watch closely: no login form appears.</strong> You are redirected straight through Keycloak and land on <span class="inline-code">/profile</span> already authenticated as <span class="inline-code">demo.user</span>.</li>
</ol>
<div class="callout"><span class="say">Say this out loud:</span> "I did not type a username or password into this second app. Keycloak recognized my existing session from the Portal and vouched for my identity automatically. That's Single Sign-On."</div>
<div class="flow">
  <div class="node">Portal login</div><span class="arrow">→</span>
  <div class="node">Keycloak session cookie set</div><span class="arrow">→</span>
  <div class="node">Admin login attempt</div><span class="arrow">→</span>
  <div class="node" style="border-color:var(--green);color:var(--green)">Code issued instantly, no form</div>
</div>`,

// 6 ---------------------------------------------------------------
`<span class="kicker">Step 5 · Optional, Technical Audience</span>
<h1>Show the API and Database Layer</h1>
<pre><code># Public endpoint — no auth needed
curl http://localhost:8089/api/public

# Product data — read from demo_app_db, independent of Keycloak's own database
curl http://localhost:8089/api/products

# Add a product
curl -X POST http://localhost:8089/api/products \\
  -H "Content-Type: application/json" \\
  -d '{"name": "Demo Item", "price": 99000}'</code></pre>
<div class="callout">Point out: business data lives in <span class="inline-code">demo_app_db</span>; Keycloak's own identity data lives in a completely separate database, <span class="inline-code">keycloak_db</span> — they never mix.</div>`,

// 7 ---------------------------------------------------------------
`<span class="kicker">Step 6 · Demo Action</span>
<h1>Logout, Three Ways</h1>
<h2>A) Logout from the Portal only</h2>
<p>In Tab 1, click <strong>Logout</strong>. Portal is now logged out. Switch to Tab 2 (Admin) and refresh — <strong>still logged in.</strong></p>
<div class="callout"><span class="say">Say this out loud:</span> "Logging out of one app does not touch the other — each app's own session is independent."</div>
<h2>B) Logout from the Admin too</h2>
<p>Both apps are now logged out at the <em>application</em> level. But the Keycloak SSO session is still alive underneath — try clicking Login again on either app, it logs you back in with zero credentials.</p>
<h2>C) True full logout (ends the Keycloak SSO session)</h2>
<pre><code>http://localhost:8088/realms/demo-sso/protocol/openid-connect/logout?client_id=nextjs-portal&post_logout_redirect_uri=http://localhost:3088</code></pre>
<p>Confirm the "Do you want to log out?" prompt. Now clicking Login on either app shows the real Keycloak login form again — the SSO session is genuinely gone.</p>`,

// 8 ---------------------------------------------------------------
`<span class="kicker">Step 7</span>
<h1>Wrap-Up Talking Points</h1>
<ul class="bullets">
  <li><strong>One login, many apps</strong> — the core SSO value proposition, just demonstrated live.</li>
  <li><strong>Keycloak never hands out the password</strong> — every login happened on Keycloak's own page.</li>
  <li><strong>Tokens never touch the browser</strong> — exchanged and used entirely server-side.</li>
  <li><strong>Two kinds of "logged in"</strong> — an app session and a Keycloak SSO session are different things.</li>
  <li><strong>Everything is native, no containers</strong> — every piece runs as a plain Windows process.</li>
</ul>
<div class="callout">This is a good moment to pause for questions before moving to shutdown.</div>`,

// 9 ---------------------------------------------------------------
`<span class="kicker">Step 8 · Wrap Up</span>
<h1>Shutting Down</h1>
<pre><code># Stop Next.js Portal, Next.js Admin, FastAPI
taskkill //F //IM node.exe
taskkill //F //IM python.exe

# Stop Keycloak
taskkill //F //IM java.exe

# PostgreSQL can be left running, or:
Stop-Service postgresql-x64-17</code></pre>
<div class="callout">All configuration (realm, clients, users, <span class="inline-code">products</span> table) is persisted in PostgreSQL — nothing needs to be recreated for the next run. Just start the services again from Step 1.</div>
<h2>🎉 Demo complete</h2>
<p>If something misbehaves mid-demo next time, check <span class="inline-code">phase-17-troubleshooting.md</span> — SYMPTOM → CAUSE → CHECK → FIX → VERIFY for every common issue.</p>`

];

let current = 0;
const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const fill = document.getElementById('progressFill');
const curNum = document.getElementById('curNum');
const totalNum = document.getElementById('totalNum');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

totalNum.textContent = slides.length;

// Build slide DOM nodes once
const slideEls = slides.map((html, i) => {
  const div = document.createElement('div');
  div.className = 'slide';
  div.innerHTML = `<div class="slide-inner">${html}</div>`;
  stage.appendChild(div);
  return div;
});

// Build dots
slides.forEach((_, i) => {
  const b = document.createElement('button');
  b.className = 'dot';
  b.setAttribute('aria-label', 'Go to step ' + (i + 1));
  b.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(b);
});
const dotEls = Array.from(dotsEl.children);

function render(prev, next, direction) {
  slideEls.forEach((el, i) => {
    el.classList.remove('active', 'exit-left');
  });
  if (prev !== null && direction === 'next') {
    slideEls[prev].classList.add('exit-left');
  }
  slideEls[next].classList.add('active');

  curNum.textContent = next + 1;
  fill.style.width = ((next + 1) / slides.length * 100) + '%';

  dotEls.forEach((d, i) => {
    d.classList.toggle('active', i === next);
    d.classList.toggle('done', i < next);
  });

  prevBtn.disabled = next === 0;
  nextBtn.textContent = next === slides.length - 1 ? 'Restart ↺' : 'Next →';

  stage.scrollTop = 0;
  slideEls[next].scrollTop = 0;
}

function goTo(i) {
  if (i < 0 || i >= slides.length || i === current) return;
  const direction = i > current ? 'next' : 'prev';
  const prev = current;
  current = i;
  render(prev, current, direction);
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => {
  if (current === slides.length - 1) { goTo(0); return; }
  goTo(current + 1);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goTo(Math.min(current + 1, slides.length - 1));
  if (e.key === 'ArrowLeft') goTo(Math.max(current - 1, 0));
});

render(null, 0, 'next');
</script>
</body>
</html>
